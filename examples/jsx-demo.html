<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSX Custom Demo</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
      }
      #container {
        width: 800px;
        height: 500px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .info {
        margin-top: 16px;
        padding: 12px;
        background: #e8e8e8;
        border-radius: 4px;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>JSX Custom Column Demo</h1>
    <div id="container"></div>
    <div class="info">
      This demo shows JSX-style declarative rendering for custom columns.<br />
      <strong>Columns:</strong> Name | Status (indicator + text) | Progress (bar
      + percent) | Actions (buttons)
    </div>
    <script src="../dist/canvas-table.umd.cjs"></script>
    <script>
      // UMD bundle exposes CanvasTable as namespace, use .default or .CanvasTable
      const CanvasTableClass = CanvasTable.default || CanvasTable.CanvasTable;
      // Constructor signature: (container: HTMLElement | string, props: CanvasTableProps)
      const table = new CanvasTableClass(document.getElementById("container"), {
        rows: [
          {
            id: "1",
            data: {
              name: "Alice",
              status: "active",
              progress: 85,
              priority: "high",
            },
          },
          {
            id: "2",
            data: {
              name: "Bob",
              status: "inactive",
              progress: 30,
              priority: "low",
            },
          },
          {
            id: "3",
            data: {
              name: "Charlie",
              status: "pending",
              progress: 60,
              priority: "medium",
            },
          },
          {
            id: "4",
            data: {
              name: "Diana",
              status: "active",
              progress: 100,
              priority: "high",
            },
          },
          {
            id: "5",
            data: {
              name: "Eve",
              status: "inactive",
              progress: 0,
              priority: "low",
            },
          },
        ],
        columns: [
          { key: "name", title: "Name", width: 100 },
          {
            key: "status",
            title: "Status",
            width: 120,
            render: (value) => ({
              type: "custom",
              jsxRender: () => ({
                type: "CTGroup",
                props: {
                  display: "flex",
                  flexDirection: "row",
                  gap: 6,
                  alignItems: "center",
                },
                children: [
                  {
                    type: "CTCircle",
                    props: {
                      radius: 6,
                      backgroundColor:
                        value === "active"
                          ? "#52c41a"
                          : value === "inactive"
                            ? "#ff4d4f"
                            : "#faad14",
                    },
                    children: [],
                  },
                  {
                    type: "CTText",
                    props: {
                      text: String(value),
                      fontSize: 12,
                      fontWeight: "bold",
                    },
                    children: [],
                  },
                ],
              }),
            }),
          },
          {
            key: "progress",
            title: "Progress",
            width: 180,
            render: (value) => ({
              type: "custom",
              jsxRender: () => {
                const percent = Math.min(100, Math.max(0, Number(value)));
                const barWidth = 120;
                const barHeight = 12;
                const fillColor =
                  percent >= 80
                    ? "#52c41a"
                    : percent >= 50
                      ? "#1890ff"
                      : percent >= 20
                        ? "#faad14"
                        : "#ff4d4f";

                return {
                  type: "CTGroup",
                  props: {
                    display: "flex",
                    flexDirection: "row",
                    gap: 8,
                    alignItems: "center",
                  },
                  children: [
                    // Progress bar container (using position='relative' for overlapping)
                    {
                      type: "CTGroup",
                      props: {
                        position: "relative",
                        width: barWidth,
                        height: barHeight,
                      },
                      children: [
                        // Background bar
                        {
                          type: "CTRect",
                          props: {
                            x: 0,
                            y: 0,
                            width: barWidth,
                            height: barHeight,
                            backgroundColor: "#f0f0f0",
                            borderRadius: 6,
                            zIndex: 0,
                          },
                          children: [],
                        },
                        // Fill bar
                        {
                          type: "CTRect",
                          props: {
                            x: 0,
                            y: 0,
                            width: (barWidth * percent) / 100,
                            height: barHeight,
                            backgroundColor: fillColor,
                            borderRadius: 6,
                            zIndex: 1,
                          },
                          children: [],
                        },
                      ],
                    },
                    // Percentage text
                    {
                      type: "CTText",
                      props: {
                        text: `${percent}%`,
                        fontSize: 11,
                        fontWeight: "bold",
                        color: fillColor,
                      },
                      children: [],
                    },
                  ],
                };
              },
            }),
          },
          {
            key: "priority",
            title: "Priority",
            width: 100,
            render: (value) => ({
              type: "custom",
              jsxRender: () => {
                const colors = {
                  high: { bg: "#ff4d4f", text: "#ffffff" },
                  medium: { bg: "#faad14", text: "#ffffff" },
                  low: { bg: "#52c41a", text: "#ffffff" },
                };
                const c = colors[value] || colors.medium;

                return {
                  type: "CTGroup",
                  props: {
                    display: "flex",
                    flexDirection: "row",
                    justifyContent: "center",
                    alignItems: "center",
                    height: 24,
                  },
                  children: [
                    // Label container with positioned children
                    {
                      type: "CTGroup",
                      props: { position: "relative", width: 70, height: 24 },
                      children: [
                        // Background rect
                        {
                          type: "CTRect",
                          props: {
                            x: 0,
                            y: 0,
                            width: 70,
                            height: 24,
                            backgroundColor: c.bg,
                            borderRadius: 4,
                            zIndex: 0,
                          },
                          children: [],
                        },
                        // Text container - 使用 flex 居中
                        {
                          type: "CTGroup",
                          props: {
                            display: "flex",
                            justifyContent: "center",
                            alignItems: "center",
                            x: 0,
                            y: 0,
                            width: 70,
                            height: 24,
                            zIndex: 1,
                          },
                          children: [
                            {
                              type: "CTText",
                              props: {
                                text: String(value).toUpperCase(),
                                fontSize: 10,
                                fontWeight: "bold",
                                color: c.text,
                              },
                              children: [],
                            },
                          ],
                        },
                      ],
                    },
                  ],
                };
              },
            }),
          },
        ],
      });
    </script>
  </body>
</html>
